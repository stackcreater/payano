name: payano_mobile
description: "Payano - Modern Two-Wheeler Ride Booking & Bike Taxi Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.0

  # Firebase Services
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0

  # Google Sign-In
  google_sign_in: ^6.3.0

  # Maps & Location
  google_maps_flutter: ^2.5.3
  maplibre_gl: ^0.27.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  firebase_database: ^12.5.0



  # Networking & Local Storage
  dio: ^5.4.1
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^3.0.1

  # UI Components & Styling
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0
  uuid: ^4.3.3
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/map/

name: payano_mobile
description: "Payano - Modern Two-Wheeler Ride Booking & Bike Taxi Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2

  # Firebase Services
  firebase_core: ^3.10.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.6

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Maps & Location
  google_maps_flutter: ^2.10.0
  maplibre_gl: ^0.27.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  firebase_database: ^11.1.6

  # Networking & Local Storage
  dio: ^5.4.1
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2
  web_socket_channel: ^3.0.1

  # UI Components & Styling
  google_fonts: ^6.2.1
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  uuid: ^4.3.3
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/map/

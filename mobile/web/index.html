  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b111e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ── Loading Splash Screen ── */
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0b111e 0%, #0f1f3d 100%);
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    /* Branded Emblem from user's Payano logo */
    .payano-brand-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }
    .splash-logo {
      width: 135px;
      height: 135px;
      border-radius: 32px;
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.12);
      object-fit: cover;
      animation: logoPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes logoPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── From Uiverse.io by vinodjangid07 — Customized for Payano Bike + Person ── */
    .loader {
      width: fit-content;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      margin-bottom: 18px;
    }

    .truckWrapper {
      width: 240px;
      height: 105px;
      display: flex;
      flex-direction: column;
      position: relative;
      align-items: center;
      justify-content: flex-end;
      overflow-x: hidden;
    }

    /* Bike + Rider upper body bounce */
    .truckBody {
      width: 125px;
      height: fit-content;
      margin-bottom: 2px;
      animation: motion 0.75s ease-in-out infinite;
    }

    .bikesvg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Suspension animation */
    @keyframes motion {
      0% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(2.5px) rotate(-1deg);
      }
      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }

    /* Bike Tires position & rotation */
    .truckTires {
      width: 105px;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0px 5px 0px 10px;
      position: absolute;
      bottom: 1px;
    }

    .truckTires svg {
      width: 26px;
      height: 26px;
      animation: spinTire 0.5s linear infinite;
    }

    @keyframes spinTire {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Road with animated dashed lines */
    .road {
      width: 100%;
      height: 2px;
      background-color: #334155;
      position: relative;
      bottom: 0;
      align-self: flex-end;
      border-radius: 3px;
    }

    .road::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 100%;
      background-color: #3b82f6;
      right: -50%;
      border-radius: 3px;
      animation: roadAnimation 1.3s linear infinite;
      border-left: 10px solid #ffffff;
    }

    .road::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 100%;
      background-color: #3b82f6;
      right: -65%;
      border-radius: 3px;
      animation: roadAnimation 1.3s linear infinite;
      border-left: 5px solid #ffffff;
    }

    /* Lamp post passing by */
    .lampPost {
      position: absolute;
      bottom: 0;
      right: -90%;
      height: 85px;
      animation: roadAnimation 1.3s linear infinite;
      opacity: 0.85;
      fill: #60a5fa;
    }

    @keyframes roadAnimation {
      0% {
        transform: translateX(0px);
      }
      100% {
        transform: translateX(-380px);
      }
    }

    .loading-label {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.8px;
    }

    /* Google Maps JS & Platform View — ensure map canvas fills 100% of container */
    flt-platform-view,
    flt-platform-view > * {
      width: 100% !important;
      height: 100% !important;
    }
    .gm-style {
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loading-indicator');
      if (!loader) return;
      loader.style.opacity = '0';
      loader.style.pointerEvents = 'none';
      setTimeout(function () {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 400);
    }

    // Fast polling: check if Flutter view or glass-pane is mounted into the DOM
    var pollCount = 0;
    var pollInterval = setInterval(function () {
      pollCount++;
      var isMounted = document.querySelector('flutter-view') || 
                      document.querySelector('flt-glass-pane') ||
                      document.querySelector('flt-scene-host');
      if (isMounted || pollCount >= 20) { // Max 2.0 seconds
        clearInterval(pollInterval);
        removeLoader();
      }
    }, 100);

    // Hard fallback: remove after 2.0s max
    setTimeout(function () {
      clearInterval(pollInterval);
      removeLoader();
    }, 2000);

    window.removePayanoLoader = removeLoader;
  </script>

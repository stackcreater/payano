<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payano - Realtime GPS & Fare Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        },
                        darkbg: '#0B0F17',
                        cardbg: 'rgba(17, 24, 39, 0.85)',
                    }
                }
            }
        }
    </script>
    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Custom scrollbar for place dropdown */
        .pac-container {
            background-color: #1e293b !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 0.75rem !important;
            color: #f8fafc !important;
            font-family: inherit !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5) !important;
            margin-top: 4px !important;
        }
        .pac-item {
            color: #cbd5e1 !important;
            border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
            padding: 8px 12px !important;
            cursor: pointer;
        }
        .pac-item:hover, .pac-item-selected {
            background-color: #334155 !important;
        }
        .pac-item-query {
            color: #ffffff !important;
            font-weight: 600 !important;
        }
        .pac-matched {
            color: #38bdf8 !important;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans h-full overflow-hidden antialiased">

    <!-- Map Container -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- Floating Top/Side Panel -->
    <div class="relative z-10 p-4 md:p-6 max-w-md w-full pointer-events-none">
        <div class="glass-panel p-5 rounded-2xl shadow-2xl pointer-events-auto space-y-4">
            
            <!-- Header -->
            <div class="flex items-center justify-between border-b border-slate-700/50 pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center border border-emerald-500/40">
                        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-white">Payano Ride GPS</h1>
                        <p class="text-xs text-slate-400">Live Telemetry & Fare Calculator</p>
                    </div>
                </div>

                <!-- WS Status Pill -->
                <div id="ws-status" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="ws-status-text">Connecting...</span>
                </div>
            </div>

            <!-- Notification / Error Toast -->
            <div id="toast-banner" class="hidden p-3 rounded-xl text-xs font-medium border space-y-1"></div>

            <!-- Booking & Autocomplete Form -->
            <form id="fare-form" onsubmit="event.preventDefault(); calculateFare();" class="space-y-3">
                
                <!-- Pickup Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Pickup Location</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>
                        </span>
                        <input type="text" id="pickup-input" placeholder="Enter pickup address or choose current location"
                            class="w-full pl-9 pr-3 py-2.5 bg-slate-900/80 border border-slate-700/70 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition">
                    </div>
                </div>

                <!-- Dropoff Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Drop-off Destination</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-rose-400">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        </span>
                        <input type="text" id="dropoff-input" placeholder="Search destination address..."
                            class="w-full pl-9 pr-3 py-2.5 bg-slate-900/80 border border-slate-700/70 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-500/50 transition">
                    </div>
                </div>

                <!-- Ride ID Input -->
                <div class="flex items-center space-x-2 pt-1">
                    <div class="w-1/2">
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-0.5">Ride Session ID</label>
                        <input type="text" id="ride-id-input" value="ride_demo_101"
                            class="w-full px-2.5 py-1.5 bg-slate-900/60 border border-slate-700/50 rounded-lg text-xs font-mono text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="w-1/2 flex items-end h-full">
                        <button type="submit" id="btn-calc"
                            class="w-full py-2 px-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-emerald-500/20 active:scale-95 transition">
                            Calculate Fare
                        </button>
                    </div>
                </div>
            </form>

            <!-- Fare Result Card -->
            <div id="fare-card" class="hidden p-4 rounded-xl bg-slate-900/90 border border-slate-700/80 space-y-3">
                <div class="flex justify-between items-start border-b border-slate-800 pb-2">
                    <div>
                        <span class="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">Estimated Fare</span>
                        <div id="calculated-fare" class="text-2xl font-extrabold text-white">₹0.00</div>
                    </div>
                    <span id="calc-badge" class="px-2 py-0.5 rounded text-[10px] font-medium bg-blue-500/10 text-blue-400 border border-blue-500/30">
                        Google Maps API
                    </span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-slate-800/50 p-2 rounded-lg">
                        <span class="text-slate-400 block text-[10px]">Driving Distance</span>
                        <span id="res-distance" class="font-bold text-slate-200">0.0 KM</span>
                    </div>
                    <div class="bg-slate-800/50 p-2 rounded-lg">
                        <span class="text-slate-400 block text-[10px]">Estimated Time</span>
                        <span id="res-duration" class="font-bold text-slate-200">0 Mins</span>
                    </div>
                </div>
            </div>

            <!-- GPS Telemetry Dashboard -->
            <div class="pt-2 border-t border-slate-800 space-y-2">
                <div class="flex justify-between items-center text-xs">
                    <span class="font-semibold text-slate-300">Live Device Telemetry</span>
                    <button onclick="toggleGpsTracking()" id="btn-gps-toggle" class="text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/30">
                        Pause Tracking
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-1.5 text-[11px] font-mono">
                    <div class="bg-slate-900/70 p-2 rounded-lg text-center">
                        <span class="text-slate-500 block text-[9px]">LATITUDE</span>
                        <span id="tel-lat" class="text-emerald-400 font-semibold">--</span>
                    </div>
                    <div class="bg-slate-900/70 p-2 rounded-lg text-center">
                        <span class="text-slate-500 block text-[9px]">LONGITUDE</span>
                        <span id="tel-lng" class="text-emerald-400 font-semibold">--</span>
                    </div>
                    <div class="bg-slate-900/70 p-2 rounded-lg text-center">
                        <span class="text-slate-500 block text-[9px]">HEADING / SPEED</span>
                        <span id="tel-motion" class="text-emerald-400 font-semibold">0° / 0m/s</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Global Application State
        let map = null;
        let vehicleMarker = null;
        let pickupMarker = null;
        let dropoffMarker = null;
        let directionsRenderer = null;
        let directionsService = null;
        
        let pickupAutocomplete = null;
        let dropoffAutocomplete = null;

        let pickupCoords = null;
        let dropoffCoords = null;
        let currentPos = { lat: 12.9716, lng: 77.5946 }; // Default: Bengaluru

        let watchId = null;
        let isTracking = true;
        let lastPos = null;

        let ws = null;
        let wsReconnectAttempts = 0;
        let wsReconnectTimer = null;
        let lastWsSendTime = 0;

        // 1. Initialize Google Map & Services
        function initMap() {
            const mapOptions = {
                zoom: 15,
                center: currentPos,
                disableDefaultUI: false,
                zoomControl: true,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,
                styles: [
                    { "elementType": "geometry", "stylers": [{ "color": "#242f3e" }] },
                    { "elementType": "labels.text.fill", "stylers": [{ "color": "#746855" }] },
                    { "elementType": "labels.text.stroke", "stylers": [{ "color": "#242f3e" }] },
                    { "featureType": "administrative.locality", "elementType": "labels.text.fill", "stylers": [{ "color": "#d59563" }] },
                    { "featureType": "poi", "elementType": "labels.text.fill", "stylers": [{ "color": "#d59563" }] },
                    { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#38414e" }] },
                    { "featureType": "road", "elementType": "geometry.stroke", "stylers": [{ "color": "#212a37" }] },
                    { "featureType": "road.highway", "elementType": "geometry", "stylers": [{ "color": "#746855" }] },
                    { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#17263c" }] }
                ]
            };

            map = new google.maps.Map(document.getElementById("map"), mapOptions);
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: true,
                polylineOptions: { strokeColor: "#10b981", strokeOpacity: 0.8, strokeWeight: 5 }
            });

            // Vector Arrow Marker for Device / Vehicle Telemetry
            const arrowSymbol = {
                path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                scale: 6,
                fillColor: "#3B82F6",
                fillOpacity: 1,
                strokeColor: "#FFFFFF",
                strokeWeight: 2,
                rotation: 0,
                anchor: new google.maps.Point(0, 2)
            };

            vehicleMarker = new google.maps.Marker({
                position: currentPos,
                map: map,
                icon: arrowSymbol,
                title: "Driver / Device Location"
            });

            // Initialize Places Autocomplete
            initAutocomplete();

            // Start Hardware GPS Watcher
            startGpsTracking();

            // Connect to WebSocket Server
            connectWebSocket();
        }

        // 2. Setup Google Places Autocomplete on Inputs
        function initAutocomplete() {
            const pickupInput = document.getElementById("pickup-input");
            const dropoffInput = document.getElementById("dropoff-input");

            const options = { fields: ["formatted_address", "geometry", "name"] };

            pickupAutocomplete = new google.maps.places.Autocomplete(pickupInput, options);
            dropoffAutocomplete = new google.maps.places.Autocomplete(dropoffInput, options);

            pickupAutocomplete.addListener("place_changed", () => {
                const place = pickupAutocomplete.getPlace();
                if (place.geometry && place.geometry.location) {
                    pickupCoords = {
                        lat: place.geometry.location.lat(),
                        lng: place.geometry.location.lng()
                    };
                    updatePickupMarker(pickupCoords, place.name);
                    triggerAutoFareIfReady();
                }
            });

            dropoffAutocomplete.addListener("place_changed", () => {
                const place = dropoffAutocomplete.getPlace();
                if (place.geometry && place.geometry.location) {
                    dropoffCoords = {
                        lat: place.geometry.location.lat(),
                        lng: place.geometry.location.lng()
                    };
                    updateDropoffMarker(dropoffCoords, place.name);
                    triggerAutoFareIfReady();
                }
            });
        }

        function updatePickupMarker(coords, title) {
            if (!pickupMarker) {
                pickupMarker = new google.maps.Marker({
                    position: coords,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 8,
                        fillColor: "#10b981",
                        fillOpacity: 1,
                        strokeColor: "#FFFFFF",
                        strokeWeight: 2
                    }
                });
            } else {
                pickupMarker.setPosition(coords);
            }
        }

        function updateDropoffMarker(coords, title) {
            if (!dropoffMarker) {
                dropoffMarker = new google.maps.Marker({
                    position: coords,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 8,
                        fillColor: "#f43f5e",
                        fillOpacity: 1,
                        strokeColor: "#FFFFFF",
                        strokeWeight: 2
                    }
                });
            } else {
                dropoffMarker.setPosition(coords);
            }
        }

        function triggerAutoFareIfReady() {
            if (pickupCoords && dropoffCoords) {
                renderRoute(pickupCoords, dropoffCoords);
                calculateFare();
            }
        }

        function renderRoute(origin, destination) {
            directionsService.route({
                origin: origin,
                destination: destination,
                travelMode: google.maps.TravelMode.DRIVING
            }, (result, status) => {
                if (status === "OK") {
                    directionsRenderer.setDirections(result);
                }
            });
        }

        // 3. Hardware GPS Access (navigator.geolocation.watchPosition)
        function startGpsTracking() {
            if (!navigator.geolocation) {
                showToast("Geolocation is not supported by your browser.", "error");
                return;
            }

            const geoOptions = {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 5000
            };

            watchId = navigator.geolocation.watchPosition(onGpsSuccess, onGpsError, geoOptions);
        }

        function onGpsSuccess(position) {
            if (!isTracking) return;

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            let heading = position.coords.heading || 0;
            const speed = position.coords.speed || 0;

            // If device heading is null, calculate heading from previous point
            if ((!heading || heading === 0) && lastPos) {
                heading = calculateBearing(lastPos.lat, lastPos.lng, lat, lng);
            }

            currentPos = { lat, lng };
            lastPos = currentPos;

            // If pickup is not set, default pickup to current position
            if (!pickupCoords) {
                pickupCoords = currentPos;
            }

            // Update Vehicle Marker Position & Smooth Arrow Rotation
            if (vehicleMarker) {
                vehicleMarker.setPosition(currentPos);
                
                const icon = vehicleMarker.getIcon();
                if (icon && typeof icon === 'object') {
                    icon.rotation = heading;
                    vehicleMarker.setIcon(icon);
                }

                map.panTo(currentPos);
            }

            // Update UI Dashboard
            document.getElementById("tel-lat").innerText = lat.toFixed(5);
            document.getElementById("tel-lng").innerText = lng.toFixed(5);
            document.getElementById("tel-motion").innerText = `${Math.round(heading)}° / ${(speed * 3.6).toFixed(1)}km/h`;

            // Stream GPS location frame over WebSocket (throttled to 1 frame per sec)
            const now = Date.now();
            if (now - lastWsSendTime >= 1000) {
                sendLocationTelemetry(lat, lng, heading, speed);
                lastWsSendTime = now;
            }
        }

        function onGpsError(error) {
            let msg = "GPS position error occurred.";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    msg = "Location permission denied. Please allow GPS access in browser settings.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    msg = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    msg = "Location request timed out. Retrying...";
                    break;
            }
            showToast(msg, "warning");
        }

        function toggleGpsTracking() {
            isTracking = !isTracking;
            const btn = document.getElementById("btn-gps-toggle");
            if (isTracking) {
                btn.innerText = "Pause Tracking";
                btn.className = "text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/30";
            } else {
                btn.innerText = "Resume Tracking";
                btn.className = "text-[11px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30 hover:bg-amber-500/30";
            }
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const rad = Math.PI / 180;
            const dLon = (lon2 - lon1) * rad;
            const y = Math.sin(dLon) * Math.cos(lat2 * rad);
            const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad) -
                      Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            return (brng + 360) % 360;
        }

        // 4. WebSocket Client & Real-time Location Streaming
        function connectWebSocket() {
            const rideId = document.getElementById("ride-id-input").value.trim() || "ride_demo_101";
            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${wsProtocol}//${window.location.host}/ws/ride/${rideId}`;

            updateWsStatus("Connecting...", "connecting");

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    updateWsStatus("Connected", "connected");
                    wsReconnectAttempts = 0;
                    if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.event === "driver_location_updated" || data.type === "location") {
                            const loc = data.location || data;
                            if (loc.latitude && loc.longitude) {
                                const newPos = { lat: parseFloat(loc.latitude), lng: parseFloat(loc.longitude) };
                                const heading = parseFloat(loc.heading) || 0;
                                
                                if (vehicleMarker) {
                                    vehicleMarker.setPosition(newPos);
                                    const icon = vehicleMarker.getIcon();
                                    if (icon && typeof icon === 'object') {
                                        icon.rotation = heading;
                                        vehicleMarker.setIcon(icon);
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.error("Failed to parse incoming WS frame:", e);
                    }
                };

                ws.onerror = (err) => {
                    console.warn("WebSocket error:", err);
                    updateWsStatus("Connection Error", "disconnected");
                };

                ws.onclose = () => {
                    updateWsStatus("Disconnected (Retrying...)", "disconnected");
                    scheduleWsReconnect();
                };
            } catch (e) {
                console.error("WebSocket setup failed:", e);
                scheduleWsReconnect();
            }
        }

        function scheduleWsReconnect() {
            wsReconnectAttempts++;
            const timeout = Math.min(1000 * Math.pow(2, wsReconnectAttempts), 10000);
            if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
            wsReconnectTimer = setTimeout(() => {
                connectWebSocket();
            }, timeout);
        }

        function sendLocationTelemetry(lat, lng, heading, speed) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const rideId = document.getElementById("ride-id-input").value.trim() || "ride_demo_101";
                const payload = {
                    type: "location",
                    rideId: rideId,
                    latitude: lat,
                    longitude: lng,
                    lat: lat,
                    lng: lng,
                    heading: heading,
                    speed: speed,
                    timestamp: new Date().toISOString()
                };
                ws.send(JSON.stringify(payload));
            }
        }

        function updateWsStatus(text, state) {
            const pill = document.getElementById("ws-status");
            const textEl = document.getElementById("ws-status-text");
            textEl.innerText = text;

            if (state === "connected") {
                pill.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                pill.firstElementChild.className = "w-2 h-2 rounded-full bg-emerald-400";
            } else if (state === "connecting") {
                pill.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30";
                pill.firstElementChild.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            } else {
                pill.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/30";
                pill.firstElementChild.className = "w-2 h-2 rounded-full bg-rose-400";
            }
        }

        // 5. Trigger Fare Calculation API Call
        async function calculateFare() {
            const btn = document.getElementById("btn-calc");
            const card = document.getElementById("fare-card");
            
            // Pick coordinates from selected places or current position defaults
            const pLat = pickupCoords ? pickupCoords.lat : currentPos.lat;
            const pLng = pickupCoords ? pickupCoords.lng : currentPos.lng;
            const dLat = dropoffCoords ? dropoffCoords.lat : currentPos.lat + 0.02;
            const dLng = dropoffCoords ? dropoffCoords.lng : currentPos.lng + 0.02;

            btn.disabled = true;
            btn.innerText = "Calculating...";

            try {
                const response = await fetch("/fare/calculate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        pickup_lat: pLat,
                        pickup_lng: pLng,
                        dropoff_lat: dLat,
                        dropoff_lng: dLng,
                        category: "moto"
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();
                
                document.getElementById("calculated-fare").innerText = `₹${data.calculated_fare.toFixed(2)}`;
                document.getElementById("res-distance").innerText = `${data.distance_km} KM`;
                document.getElementById("res-duration").innerText = `${data.duration_mins} Mins`;
                
                const badge = document.getElementById("calc-badge");
                if (data.breakdown && data.breakdown.calculationSource === "google_maps") {
                    badge.innerText = "Google Maps API";
                    badge.className = "px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                } else {
                    badge.innerText = "Haversine Fallback";
                    badge.className = "px-2 py-0.5 rounded text-[10px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/30";
                }

                card.classList.remove("hidden");
                hideToast();
            } catch (err) {
                console.error("Fare calculation error:", err);
                showToast("Failed to calculate fare. Please try again.", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Calculate Fare";
            }
        }

        // Helper: Toast Notifications
        function showToast(message, type = "info") {
            const banner = document.getElementById("toast-banner");
            banner.classList.remove("hidden");
            banner.innerText = message;
            if (type === "error") {
                banner.className = "p-3 rounded-xl text-xs font-medium bg-rose-500/10 text-rose-300 border border-rose-500/30";
            } else if (type === "warning") {
                banner.className = "p-3 rounded-xl text-xs font-medium bg-amber-500/10 text-amber-300 border border-amber-500/30";
            } else {
                banner.className = "p-3 rounded-xl text-xs font-medium bg-blue-500/10 text-blue-300 border border-blue-500/30";
            }
        }

        function hideToast() {
            document.getElementById("toast-banner").classList.add("hidden");
        }

        // Reconnect WebSocket if Ride ID changes
        document.getElementById("ride-id-input").addEventListener("change", () => {
            if (ws) ws.close();
            connectWebSocket();
        });
    </script>
